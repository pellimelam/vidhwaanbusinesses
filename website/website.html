<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0a0a0a"
  >

  <meta
    name="color-scheme"
    content="light"
  >

  <meta
    name="description"
    id="meta-description"
    content=""
  >

  <meta
    name="robots"
    content="index,follow"
  >

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <link
    rel="icon"
    href="../icons/icon-512.png"
  >

  <link
    rel="apple-touch-icon"
    href="../icons/icon-192.png"
  >

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <link
    rel="stylesheet"
    href="../website.css"
  >

  <title id="page-title">Business Website</title>
</head>

<body>

  <!-- =========================================================
       ACCESSIBILITY
       ========================================================= -->

  <a
    class="website-skip-link"
    href="#main-content"
  >
    Skip to content
  </a>


  <!-- =========================================================
       HEADER
       ========================================================= -->

  <header
    class="website-header"
    id="website-header"
  >

    <div class="website-header__inner">

      <a
        class="website-brand"
        id="website-brand"
        href="#top"
        aria-label="Business home"
      >

        <span
          class="website-brand__logo"
          id="website-brand-logo"
          aria-hidden="true"
        >
          <img
            id="website-brand-logo-image"
            src=""
            alt=""
          >
        </span>

        <span class="website-brand__text">

          <span
            class="website-brand__name"
            id="website-brand-name"
          >
            Business
          </span>

          <span
            class="website-brand__tagline"
            id="website-brand-tagline"
          ></span>

        </span>

      </a>


      <nav
        class="website-header__actions"
        aria-label="Business contact actions"
      >

        <a
          class="website-header__action website-header__action--phone"
          id="website-header-phone"
          href="#"
          hidden
        >
          <span
            aria-hidden="true"
          >
            Call
          </span>
        </a>

        <a
          class="website-header__action website-header__action--whatsapp"
          id="website-header-whatsapp"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          hidden
        >
          <span
            aria-hidden="true"
          >
            WhatsApp
          </span>
        </a>

      </nav>

    </div>

  </header>


  <!-- =========================================================
       MAIN
       ========================================================= -->

  <main
    id="main-content"
    class="website-main"
  >

    <!-- =======================================================
         HERO
         ======================================================= -->

    <section
      class="website-hero"
      id="website-hero"
      aria-labelledby="website-hero-title"
    >

      <div class="website-container website-hero__inner">

        <div class="website-hero__content">

          <p
            class="website-hero__eyebrow"
            id="website-hero-eyebrow"
            hidden
          >
            Welcome
          </p>

          <h1
            class="website-hero__title"
            id="website-hero-title"
          >
            Business
          </h1>

          <p
            class="website-hero__tagline"
            id="website-hero-tagline"
            hidden
          ></p>

          <div
            class="website-hero__actions"
            id="website-hero-actions"
            hidden
          >

            <a
              class="website-button website-button--primary"
              id="website-hero-whatsapp"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
            >
              Connect on WhatsApp
            </a>

            <a
              class="website-button website-button--secondary"
              id="website-hero-contact"
              href="#website-contact"
            >
              Contact Us
            </a>

            <a
              class="website-button website-button--location"
              id="website-hero-location"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              hidden
              aria-label="Open business live location in Google Maps"
            >
              Business Live Location
            </a>

          </div>

        </div>

        <div
          class="website-hero__visual"
          id="website-hero-visual"
          hidden
        >

          <div class="website-hero__visual-frame">

            <img
              id="website-hero-logo"
              src=""
              alt=""
            >

          </div>

        </div>

      </div>

      <div
        class="website-hero__scroll"
        aria-hidden="true"
      >
        <span></span>
      </div>

    </section>


    <!-- =======================================================
         DYNAMIC CONTENT
         ======================================================= -->

    <div
      id="website-sections"
      class="website-sections"
    ></div>


    <!-- =======================================================
         CONTACT
         ======================================================= -->

    <section
      class="website-contact"
      id="website-contact"
      aria-labelledby="website-contact-title"
    >

      <div class="website-container">

        <div class="website-contact__card">

          <div class="website-contact__content">

            <p class="website-section-eyebrow">
              Contact
            </p>

            <h2
              class="website-contact__title"
              id="website-contact-title"
            >
              Let's connect.
            </h2>

            <p
              class="website-contact__description"
              id="website-contact-description"
            >
              Get in touch with us for more information.
            </p>

          </div>


          <div
            class="website-contact__details"
            id="website-contact-details"
          >

            <a
              class="website-contact__item"
              id="website-contact-phone"
              href="#"
              hidden
            >

              <span class="website-contact__item-label">
                Phone
              </span>

              <span
                class="website-contact__item-value"
                id="website-contact-phone-value"
              ></span>

            </a>


            <a
              class="website-contact__item"
              id="website-contact-email"
              href="#"
              hidden
            >

              <span class="website-contact__item-label">
                Email
              </span>

              <span
                class="website-contact__item-value"
                id="website-contact-email-value"
              ></span>

            </a>


            <a
              class="website-contact__item"
              id="website-contact-whatsapp"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              hidden
            >

              <span class="website-contact__item-label">
                WhatsApp
              </span>

              <span
                class="website-contact__item-value"
                id="website-contact-whatsapp-value"
              ></span>

            </a>


            <div
              class="website-contact__item"
              id="website-contact-address"
              hidden
            >

              <span class="website-contact__item-label">
                Address
              </span>

              <span
                class="website-contact__item-value"
                id="website-contact-address-value"
              ></span>

            </div>

          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- =========================================================
       FOOTER
       ========================================================= -->

  <footer
    class="website-footer"
    id="website-footer"
  >

    <div class="website-container">

      <div class="website-footer__top">

        <div class="website-footer__brand">

          <a
            class="website-footer__identity"
            href="#top"
          >

            <span
              class="website-footer__logo"
              id="website-footer-logo"
            >
              <img
                id="website-footer-logo-image"
                src=""
                alt=""
              >
            </span>

            <span
              class="website-footer__name"
              id="website-footer-name"
            >
              Business
            </span>

          </a>

          <p
            class="website-footer__tagline"
            id="website-footer-tagline"
          ></p>

        </div>


        <nav
          class="website-footer__links"
          id="website-footer-links"
          aria-label="Footer links"
        ></nav>

      </div>


      <div class="website-footer__bottom">

        <p class="website-footer__copyright">
          ©
          <span id="website-footer-year"></span>
          <span id="website-footer-copyright-name">
            Business
          </span>
          . All rights reserved.
        </p>

        <p class="website-footer__powered">
          Powered by
          <a
            href="https://vidhwaan.com"
            target="_blank"
            rel="noopener noreferrer"
          >
            Vidhwaan
          </a>
        </p>

      </div>

    </div>

  </footer>


  <!-- =========================================================
       IMAGE LIGHTBOX
       ========================================================= -->

  <div
    class="website-lightbox"
    id="website-lightbox"
    hidden
    aria-hidden="true"
    role="dialog"
    aria-modal="true"
    aria-label="Image viewer"
  >

    <div class="website-lightbox__backdrop"></div>

    <div class="website-lightbox__dialog">

      <button
        type="button"
        class="website-lightbox__close"
        id="website-lightbox-close"
        aria-label="Close image viewer"
      >
        <span aria-hidden="true">×</span>
      </button>

      <img
        class="website-lightbox__image"
        id="website-lightbox-image"
        src=""
        alt=""
      >

    </div>

  </div>


  <!-- =========================================================
       VIDEO MODAL
       ========================================================= -->

  <div
    class="website-video-modal"
    id="website-video-modal"
    hidden
    aria-hidden="true"
    role="dialog"
    aria-modal="true"
    aria-label="Video player"
  >

    <div class="website-video-modal__backdrop"></div>

    <div class="website-video-modal__dialog">

      <button
        type="button"
        class="website-video-modal__close"
        id="website-video-modal-close"
        aria-label="Close video"
      >
        <span aria-hidden="true">×</span>
      </button>

      <div
        class="website-video-modal__frame"
        id="website-video-modal-frame"
      ></div>

    </div>

  </div>

  <!-- =========================================================
       PWA INSTALL BUTTON
       ========================================================= -->

  <button
    type="button"
    class="website-install-button"
    id="website-install-button"
    hidden
    aria-label="Install this website as an app"
  >
    Install App
  </button>


  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

  <script
    src="../website.js"
    defer
  ></script>

</body>
</html>
