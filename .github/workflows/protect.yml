name: Vidhwaan Production Optimization

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-optimization-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optimize:
    name: Optimize Production Files
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ==========================================================
      # 2. NODE.JS
      # ==========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      # ==========================================================
      # 3. VERIFY ENVIRONMENT
      # ==========================================================

      - name: Verify environment
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo " VIDHWAAN PRODUCTION OPTIMIZER"
          echo "=============================================="

          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Workspace:"
          echo "$GITHUB_WORKSPACE"

          test -d "$GITHUB_WORKSPACE"

          echo ""
          echo "✓ Environment verified."

      # ==========================================================
      # 4. INSTALL EXACT BUILD DEPENDENCIES
      # ==========================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          BUILD_DIR="$RUNNER_TEMP/vidhwaan-builder"

          rm -rf "$BUILD_DIR"

          mkdir -p "$BUILD_DIR"

          cat > "$BUILD_DIR/package.json" <<'EOF'
          {
            "name": "vidhwaan-production-optimizer",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "html-minifier-terser": "7.2.0",
              "clean-css": "5.3.3",
              "terser": "5.51.2",
              "javascript-obfuscator": "4.1.1"
            }
          }
          EOF

          cd "$BUILD_DIR"

          npm install \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --no-package-lock

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "✓ Build dependencies installed."

      # ==========================================================
      # 5. VERIFY BUILD DEPENDENCIES
      # ==========================================================

      - name: Verify build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$BUILD_DIR"

          node <<'NODE'
          const html = require("html-minifier-terser");
          const css = require("clean-css");
          const terser = require("terser");
          const obfuscator = require("javascript-obfuscator");

          if (
            !html ||
            typeof html.minify !== "function"
          ) {
            throw new Error(
              "html-minifier-terser is unavailable."
            );
          }

          if (
            typeof css !== "function"
          ) {
            throw new Error(
              "clean-css is unavailable."
            );
          }

          if (
            !terser ||
            typeof terser.minify !== "function"
          ) {
            throw new Error(
              "terser is unavailable."
            );
          }

          if (
            !obfuscator ||
            typeof obfuscator.obfuscate !== "function"
          ) {
            throw new Error(
              "javascript-obfuscator is unavailable."
            );
          }

          console.log(
            "✓ html-minifier-terser loaded."
          );

          console.log(
            "✓ clean-css loaded."
          );

          console.log(
            "✓ terser loaded."
          );

          console.log(
            "✓ javascript-obfuscator loaded."
          );

          console.log(
            "✓ All production tools verified."
          );
          NODE

      # ==========================================================
      # 6. OPTIMIZE NEW / CHANGED FILES
      #
      # IMPORTANT:
      #
      # The manifest is NOT trusted by itself.
      #
      # A file is skipped ONLY when:
      #
      #   1. It exists in the manifest
      #   2. Its current hash matches the recorded hash
      #   3. Its current contents are already valid production output
      #
      # Otherwise it is processed again.
      # ==========================================================

      - name: Optimize new and changed files
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > "$BUILD_DIR/optimize.cjs" <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");

          const {
            minify: minifyHTML
          } = require("html-minifier-terser");

          const CleanCSS =
            require("clean-css");

          const {
            minify: minifyJS
          } = require("terser");

          const JavaScriptObfuscator =
            require("javascript-obfuscator");

          const WORKSPACE =
            process.env.GITHUB_WORKSPACE;

          if (!WORKSPACE) {
            throw new Error(
              "GITHUB_WORKSPACE is missing."
            );
          }

          const MANIFEST_DIR =
            path.join(
              WORKSPACE,
              ".github"
            );

          const MANIFEST =
            path.join(
              MANIFEST_DIR,
              "production-manifest.json"
            );

          const excludedDirectories =
            new Set([
              ".git",
              ".github",
              "node_modules",
              ".cache",
              ".next",
              "coverage",
              "dist",
              "build",
              "out"
            ]);

          const excludedFiles =
            new Set([
              "package-lock.json",
              "npm-shrinkwrap.json",
              "yarn.lock",
              "pnpm-lock.yaml"
            ]);

          const htmlFiles = [];
          const cssFiles = [];
          const jsFiles = [];
          const jsonFiles = [];

          function sha256(content) {
            return crypto
              .createHash("sha256")
              .update(content)
              .digest("hex");
          }

          function relativeFile(file) {
            return path
              .relative(
                WORKSPACE,
                file
              )
              .split(path.sep)
              .join("/");
          }

          function readManifest() {
            if (
              !fs.existsSync(
                MANIFEST
              )
            ) {
              return {
                version: 2,
                files: {}
              };
            }

            try {
              const parsed =
                JSON.parse(
                  fs.readFileSync(
                    MANIFEST,
                    "utf8"
                  )
                );

              if (
                !parsed ||
                typeof parsed !== "object" ||
                !parsed.files ||
                typeof parsed.files !== "object"
              ) {
                throw new Error(
                  "Invalid production manifest structure."
                );
              }

              return parsed;
            } catch (error) {
              throw new Error(
                `Cannot read production manifest: ${error.message}`
              );
            }
          }

          function writeManifest(manifest) {
            fs.mkdirSync(
              MANIFEST_DIR,
              {
                recursive: true
              }
            );

            const temporary =
              `${MANIFEST}.tmp`;

            fs.writeFileSync(
              temporary,
              JSON.stringify(
                manifest,
                null,
                2
              ) + "\n",
              "utf8"
            );

            fs.renameSync(
              temporary,
              MANIFEST
            );
          }

          function walk(directory) {
            const entries =
              fs.readdirSync(
                directory,
                {
                  withFileTypes: true
                }
              );

            for (
              const entry of entries
            ) {
              if (
                entry.isDirectory() &&
                excludedDirectories.has(
                  entry.name
                )
              ) {
                continue;
              }

              if (
                entry.isFile() &&
                excludedFiles.has(
                  entry.name
                )
              ) {
                continue;
              }

              const full =
                path.join(
                  directory,
                  entry.name
                );

              if (
                entry.isDirectory()
              ) {
                walk(full);
                continue;
              }

              if (
                !entry.isFile()
              ) {
                continue;
              }

              const ext =
                path.extname(
                  entry.name
                ).toLowerCase();

              if (
                ext === ".html" ||
                ext === ".htm"
              ) {
                htmlFiles.push(full);
              }

              if (
                ext === ".css"
              ) {
                cssFiles.push(full);
              }

              if (
                ext === ".js"
              ) {
                jsFiles.push(full);
              }

              if (
                ext === ".json"
              ) {
                jsonFiles.push(full);
              }
            }
          }

          function isOneLine(content) {
            return (
              !String(content)
                .includes("\n") &&
              !String(content)
                .includes("\r")
            );
          }

          function isValidJSON(content) {
            try {
              JSON.parse(content);
              return true;
            } catch {
              return false;
            }
          }

          function looksLikeHTMLProduction(content) {
            return isOneLine(content);
          }

          function looksLikeCSSProduction(content) {
            return isOneLine(content);
          }

          function looksLikeJSProduction(content) {
            return isOneLine(content);
          }

          function looksLikeJSONProduction(content) {
            return (
              isOneLine(content) &&
              isValidJSON(content)
            );
          }

          function alreadyProduction(
            file,
            source,
            manifestEntry
          ) {
            if (
              !manifestEntry ||
              manifestEntry.status !== "processed"
            ) {
              return false;
            }

            const currentHash =
              sha256(source);

            if (
              manifestEntry.outputHash !==
              currentHash
            ) {
              return false;
            }

            const ext =
              path.extname(
                file
              ).toLowerCase();

            if (
              ext === ".html" ||
              ext === ".htm"
            ) {
              return looksLikeHTMLProduction(
                source
              );
            }

            if (
              ext === ".css"
            ) {
              return looksLikeCSSProduction(
                source
              );
            }

            if (
              ext === ".js"
            ) {
              return looksLikeJSProduction(
                source
              );
            }

            if (
              ext === ".json"
            ) {
              return looksLikeJSONProduction(
                source
              );
            }

            return false;
          }

          async function processHTML(file) {
            const source =
              fs.readFileSync(
                file,
                "utf8"
              );

            const output =
              await minifyHTML(
                source,
                {
                  collapseWhitespace: true,
                  conservativeCollapse: false,
                  collapseInlineTagWhitespace: true,
                  removeComments: true,
                  removeRedundantAttributes: true,
                  removeScriptTypeAttributes: true,
                  removeStyleLinkTypeAttributes: true,
                  removeEmptyAttributes: true,
                  removeAttributeQuotes: true,
                  useShortDoctype: true,
                  minifyCSS: true,
                  minifyJS: true
                }
              );

            const finalOutput =
              String(output)
                .replace(/^\uFEFF/, "")
                .replace(/\r\n/g, "")
                .replace(/\r/g, "")
                .replace(/\n/g, "")
                .trim();

            fs.writeFileSync(
              file,
              finalOutput,
              "utf8"
            );

            return finalOutput;
          }

          function processCSS(file) {
            const source =
              fs.readFileSync(
                file,
                "utf8"
              );

            const result =
              new CleanCSS({
                level: 2,
                format: false,
                sourceMap: false,
                rebase: false
              }).minify(source);

            if (
              result.errors &&
              result.errors.length
            ) {
              throw new Error(
                result.errors.join("\n")
              );
            }

            if (
              typeof result.styles !==
              "string"
            ) {
              throw new Error(
                `CleanCSS produced no output: ${file}`
              );
            }

            const finalOutput =
              result.styles
                .replace(/^\uFEFF/, "")
                .replace(/\r\n/g, "")
                .replace(/\r/g, "")
                .replace(/\n/g, "")
                .trim();

            if (
              !finalOutput
            ) {
              throw new Error(
                `CleanCSS produced empty output: ${file}`
              );
            }

            fs.writeFileSync(
              file,
              finalOutput,
              "utf8"
            );

            return finalOutput;
          }

          async function processJS(file) {
            const source =
              fs.readFileSync(
                file,
                "utf8"
              );

            /*
             * Obfuscate first.
             *
             * Conservative production settings are used
             * to reduce the chance of breaking PWA code,
             * service workers and application logic.
             */

            const obfuscated =
              JavaScriptObfuscator.obfuscate(
                source,
                {
                  compact: true,

                  identifierNamesGenerator:
                    "hexadecimal",

                  renameGlobals: false,

                  simplify: true,

                  stringArray: true,

                  stringArrayCallsTransform:
                    true,

                  stringArrayCallsTransformThreshold:
                    0.75,

                  stringArrayEncoding: [
                    "base64"
                  ],

                  stringArrayIndexShift:
                    true,

                  stringArrayRotate:
                    true,

                  stringArrayShuffle:
                    true,

                  stringArrayWrappersCount:
                    1,

                  stringArrayWrappersChainedCalls:
                    true,

                  stringArrayWrappersParametersMaxCount:
                    2,

                  stringArrayWrappersType:
                    "variable",

                  splitStrings:
                    false,

                  unicodeEscapeSequence:
                    false,

                  controlFlowFlattening:
                    false,

                  deadCodeInjection:
                    false,

                  debugProtection:
                    false,

                  disableConsoleOutput:
                    false,

                  selfDefending:
                    false
                }
              );

            const obfuscatedCode =
              obfuscated.getObfuscatedCode();

            const result =
              await minifyJS(
                obfuscatedCode,
                {
                  compress: true,

                  mangle: false,

                  format: {
                    beautify: false,
                    comments: false,
                    semicolons: true
                  }
                }
              );

            if (
              !result ||
              typeof result.code !==
              "string"
            ) {
              throw new Error(
                `JavaScript optimization produced no output: ${file}`
              );
            }

            const finalOutput =
              result.code
                .replace(/^\uFEFF/, "")
                .replace(/\r\n/g, "")
                .replace(/\r/g, "")
                .replace(/\n/g, "")
                .trim();

            if (
              !finalOutput
            ) {
              throw new Error(
                `JavaScript optimization produced empty output: ${file}`
              );
            }

            fs.writeFileSync(
              file,
              finalOutput,
              "utf8"
            );

            return finalOutput;
          }

          function processJSON(file) {
            const source =
              fs.readFileSync(
                file,
                "utf8"
              );

            let parsed;

            try {
              parsed =
                JSON.parse(source);
            } catch (error) {
              throw new Error(
                `Invalid JSON in ${relativeFile(file)}: ${error.message}`
              );
            }

            const output =
              JSON.stringify(
                parsed
              );

            if (
              typeof output !==
              "string"
            ) {
              throw new Error(
                `JSON compression produced no output: ${file}`
              );
            }

            fs.writeFileSync(
              file,
              output,
              "utf8"
            );

            return output;
          }

          async function processFile(
            file
          ) {
            const ext =
              path.extname(
                file
              ).toLowerCase();

            if (
              ext === ".html" ||
              ext === ".htm"
            ) {
              return await processHTML(
                file
              );
            }

            if (
              ext === ".css"
            ) {
              return processCSS(
                file
              );
            }

            if (
              ext === ".js"
            ) {
              return await processJS(
                file
              );
            }

            if (
              ext === ".json"
            ) {
              return processJSON(
                file
              );
            }

            throw new Error(
              `Unsupported production file type: ${file}`
            );
          }

          async function main() {
            console.log(
              "=============================================="
            );

            console.log(
              " VIDHWAAN PRODUCTION OPTIMIZATION"
            );

            console.log(
              "=============================================="
            );

            const manifest =
              readManifest();

            walk(WORKSPACE);

            const allFiles = [
              ...htmlFiles,
              ...cssFiles,
              ...jsFiles,
              ...jsonFiles
            ];

            console.log("");
            console.log(
              `HTML files found: ${htmlFiles.length}`
            );

            console.log(
              `CSS files found:  ${cssFiles.length}`
            );

            console.log(
              `JS files found:   ${jsFiles.length}`
            );

            console.log(
              `JSON files found: ${jsonFiles.length}`
            );

            console.log("");

            let processed = 0;
            let skipped = 0;

            for (
              const file of allFiles
            ) {
              const relative =
                relativeFile(file);

              let source =
                fs.readFileSync(
                  file,
                  "utf8"
                );

              const entry =
                manifest.files[
                  relative
                ];

              /*
               * IMPORTANT:
               *
               * We compare the CURRENT FILE
               * against the recorded OUTPUT hash.
               *
               * Therefore an already optimized file
               * is skipped.
               *
               * If somebody replaces or edits the file,
               * its hash changes and it is rebuilt.
               */

              if (
                alreadyProduction(
                  file,
                  source,
                  entry
                )
              ) {
                console.log(
                  `SKIP  ${relative}`
                );

                skipped++;

                continue;
              }

              console.log(
                `BUILD ${relative}`
              );

              const finalOutput =
                await processFile(
                  file
                );

              /*
               * Verify immediately.
               */

              if (
                !isOneLine(
                  finalOutput
                )
              ) {
                throw new Error(
                  `Production output is not one line: ${relative}`
                );
              }

              const ext =
                path.extname(
                  file
                ).toLowerCase();

              if (
                ext === ".json" &&
                !isValidJSON(
                  finalOutput
                )
              ) {
                throw new Error(
                  `Production JSON is invalid: ${relative}`
                );
              }

              const finalHash =
                sha256(
                  finalOutput
                );

              /*
               * ONLY AFTER successful processing
               * and successful validation do we
               * update the manifest.
               */

              manifest.files[
                relative
              ] = {
                outputHash:
                  finalHash,

                status:
                  "processed",

                type:
                  ext.substring(1),

                updatedAt:
                  new Date().toISOString()
              };

              processed++;

              /*
               * Keep the variable explicitly refreshed
               * so the logic always refers to the final
               * file state.
               */

              source =
                finalOutput;
            }

            /*
             * Remove manifest entries for files
             * that no longer exist.
             */

            const currentFiles =
              new Set(
                allFiles.map(
                  relativeFile
                )
              );

            for (
              const file of Object.keys(
                manifest.files
              )
            ) {
              if (
                !currentFiles.has(file)
              ) {
                delete manifest.files[
                  file
                ];
              }
            }

            manifest.version =
              2;

            writeManifest(
              manifest
            );

            console.log("");
            console.log(
              "=============================================="
            );

            console.log(
              " OPTIMIZATION COMPLETE"
            );

            console.log(
              "=============================================="
            );

            console.log("");
            console.log(
              `Processed: ${processed}`
            );

            console.log(
              `Skipped:   ${skipped}`
            );

            console.log("");
            console.log(
              "✓ New files processed."
            );

            console.log(
              "✓ Changed files processed."
            );

            console.log(
              "✓ Already optimized files skipped."
            );

            console.log(
              "✓ Manifest updated only after successful processing."
            );
          }

          main().catch(
            (error) => {
              console.error("");
              console.error(
                "=============================================="
              );

              console.error(
                " BUILD FAILED"
              );

              console.error(
                "=============================================="
              );

              console.error("");

              console.error(
                error
              );

              process.exit(1);
            }
          );
          NODE

          node "$BUILD_DIR/optimize.cjs"

      # ==========================================================
      # 7. FINAL HTML / CSS / JS / JSON VERIFICATION
      #
      # This checks the ACTUAL repository files.
      # ==========================================================

      - name: Verify production files
        shell: bash
        run: |
          set -Eeuo pipefail

          FAILED=0

          echo "=============================================="
          echo " VERIFY PRODUCTION FILES"
          echo "=============================================="

          while IFS= read -r -d '' FILE; do

            LINES=$(
              awk 'END {print NR}' "$FILE"
            )

            if [[ "$LINES" -ne 1 ]]; then
              echo "❌ $FILE → $LINES lines"
              FAILED=1
            else
              echo "✓ $FILE"
            fi

          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( \
                -name "*.html" \
                -o -name "*.htm" \
                -o -name "*.css" \
                -o -name "*.js" \
                -o -name "*.json" \
              \) \
              ! -path "*/.git/*" \
              ! -path "*/.github/production-manifest.json" \
              ! -path "*/node_modules/*" \
              ! -path "*/.cache/*" \
              ! -path "*/.next/*" \
              ! -path "*/coverage/*" \
              ! -path "*/dist/*" \
              ! -path "*/build/*" \
              ! -path "*/out/*" \
              ! -name "package-lock.json" \
              ! -name "npm-shrinkwrap.json" \
              -print0
          )

          if [[ "$FAILED" -ne 0 ]]; then
            echo ""
            echo "❌ ONE-LINE VERIFICATION FAILED."
            exit 1
          fi

          echo ""
          echo "✓ ALL PRODUCTION HTML/CSS/JS/JSON FILES ARE ONE LINE."

      # ==========================================================
      # 8. VERIFY ALL JSON FILES
      # ==========================================================

      - name: Verify JSON files
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root =
            process.env.GITHUB_WORKSPACE;

          const excludedDirectories =
            new Set([
              ".git",
              "node_modules",
              ".cache",
              ".next",
              "coverage",
              "dist",
              "build",
              "out"
            ]);

          const excludedFiles =
            new Set([
              "package-lock.json",
              "npm-shrinkwrap.json",
              "production-manifest.json"
            ]);

          let count = 0;

          function walk(dir) {
            const entries =
              fs.readdirSync(
                dir,
                {
                  withFileTypes: true
                }
              );

            for (
              const entry of entries
            ) {
              if (
                entry.isDirectory() &&
                excludedDirectories.has(
                  entry.name
                )
              ) {
                continue;
              }

              const full =
                path.join(
                  dir,
                  entry.name
                );

              if (
                entry.isDirectory()
              ) {
                walk(full);
                continue;
              }

              if (
                !entry.isFile()
              ) {
                continue;
              }

              if (
                !entry.name
                  .toLowerCase()
                  .endsWith(".json")
              ) {
                continue;
              }

              if (
                excludedFiles.has(
                  entry.name
                )
              ) {
                continue;
              }

              const source =
                fs.readFileSync(
                  full,
                  "utf8"
                );

              try {
                JSON.parse(source);
              } catch (error) {
                throw new Error(
                  `Invalid JSON: ${path.relative(root, full)}: ${error.message}`
                );
              }

              if (
                source.includes("\n") ||
                source.includes("\r")
              ) {
                throw new Error(
                  `JSON is not one line: ${path.relative(root, full)}`
                );
              }

              console.log(
                `✓ ${path.relative(root, full)}`
              );

              count++;
            }
          }

          walk(root);

          console.log("");
          console.log(
            `✓ Verified ${count} JSON files.`
          );

          console.log(
            "✓ All JSON files are valid and compressed."
          );
          NODE

      # ==========================================================
      # 9. VERIFY NO PUBLIC DIRECTORY
      # ==========================================================

      - name: Verify repository structure
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -d "$GITHUB_WORKSPACE/public" ]]; then
            echo "❌ public/ directory must not exist."
            exit 1
          fi

          echo "✓ No public/ directory created."

          if [[ -d "$GITHUB_WORKSPACE/node_modules" ]]; then
            echo "❌ node_modules/ directory must not exist."
            exit 1
          fi

          echo "✓ No node_modules/ directory."

      # ==========================================================
      # 10. COMMIT PRODUCTION CHANGES
      # ==========================================================

      - name: Commit optimized files
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
